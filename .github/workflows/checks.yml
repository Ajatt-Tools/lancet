name: Checks

on:
  # Branch pushes run directly; release tags invoke these checks through workflow_call.
  push:
    branches:
      - "**"
  pull_request:
  # Allow to gate release builds on these checks.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-tests:
    name: Test Python package and scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository revision
        uses: actions/checkout@v7
        with:
          # Text-detector imports and tests require the bundled implementation.
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update
          # PyQt needs EGL, while pynput needs an X display even for test collection.
          sudo apt-get install --yes libegl1 xvfb

      - name: Install Hatch
        run: python -m pip install hatch

      - name: Run tests
        # The Hatch matrix pins Python 3.14; Xvfb provides pynput's required X connection.
        run: xvfb-run --auto-servernum hatch test

      - name: Check shell scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: scripts
